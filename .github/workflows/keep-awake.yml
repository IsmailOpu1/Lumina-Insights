name: Keep database awake

# Supabase pauses a free project after about a week with no activity. One
# small read a day keeps it running. It uses the public browser key and reads
# only the public price list, so it needs no secrets.

on:
  schedule:
    - cron: "17 3 * * *" # daily, 09:17 in Dhaka
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the price list
        env:
          URL: https://zfpsldylzmpadlknypzz.supabase.co/rest/v1/plans?select=id
          KEY: sb_publishable_fy4mJf_wedc6x1JvU9lv4w_hVM38kEK
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 --retry 3 -H "apikey: $KEY" "$URL")
          echo "Supabase answered $status"
          test "$status" = "200"
